<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SABIS KILLER</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="launcher-card">
    <div class="launcher-header">
      <div class="logo-area">
        <div class="logo-dot"></div>
        <h1>SABIS KILLER <span class="version-tag">v1.5</span></h1>
      </div>
    </div>
    <p id="launcher-status" class="launcher-desc">Opening in-page settings overlay...</p>
    <div class="launcher-actions">
      <button type="button" id="btn-open-settings" class="launcher-btn">Open Settings Overlay</button>
    </div>
    <p class="launcher-hint">Tip: You can also click or drag the gear icon directly on any webpage.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
